# Ingress exposing the retail-store "ui" service via an internet-facing ALB.
# The AWS Load Balancer Controller (installed by Terraform) reconciles this.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: retail-ui
  namespace: retail-app
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /
    # TLS terminated at the ALB via an ACM-managed certificate (bonus 5.2).
    # HTTP:80 is kept only to issue a 443 redirect; all traffic upgrades to HTTPS.
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:663958378887:certificate/163eea77-78ca-4cdd-901d-41a4d66e5607
    alb.ingress.kubernetes.io/ssl-redirect: '443'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 80
