# Per-component values for the retail-store-sample-app Helm charts.
#
# The upstream project publishes one chart per microservice. Each block below is
# the values file passed to the corresponding `helm upgrade --install` (see
# k8s/README.md). Secrets are NOT stored here — replace the <PLACEHOLDER> host
# and password values locally (e.g. in /tmp) before deploying; do not commit
# real credentials. Each chart creates its own Kubernetes secret.

# ---- catalog-values.yaml  (retail-store-sample-catalog-chart) --------------
# catalog -> Amazon RDS (MySQL)
catalog:
  mysql:
    create: false            # disable the bundled in-cluster MySQL
  app:
    persistence:
      provider: mysql
      endpoint: "<MYSQL_HOST>:3306"   # project-bedrock-mysql RDS endpoint
      database: catalog
      secret:
        create: true
        name: catalog-db
        username: catalog_user
        password: "<MYSQL_PASSWORD>"

# ---- orders-values.yaml  (retail-store-sample-orders-chart) ----------------
# orders -> Amazon RDS (PostgreSQL); messaging kept in-memory (no RabbitMQ)
orders:
  postgresql:
    create: false
  rabbitmq:
    create: false
  app:
    persistence:
      provider: postgres
      endpoint: "<POSTGRES_HOST>:5432" # project-bedrock-postgres RDS endpoint
      database: orders
      secret:
        create: true
        name: orders-db
        username: orders_user
        password: "<POSTGRES_PASSWORD>"
    messaging:
      provider: in-memory

# ---- carts-values.yaml  (retail-store-sample-cart-chart) -------------------
# carts -> Amazon DynamoDB (table + GSI idx_global_customerId from data module)
carts:
  dynamodb:
    create: false            # use the real table, not dynamodb-local
  app:
    persistence:
      provider: dynamodb
      dynamodb:
        tableName: project-bedrock-carts
        createTable: false

# ---- checkout  (retail-store-sample-checkout-chart) ------------------------
# checkout -> in-cluster Redis. The chart default is in-memory, so we enable the
# bundled Redis (redis.create) and point persistence at it.
checkout:
  redis:
    create: true            # deploy the in-cluster redis pod (checkout-redis)
  app:
    persistence:
      provider: redis
      redis:
        endpoint: "checkout-redis:6379"

# ---- ui-values.yaml  (retail-store-sample-ui-chart) ------------------------
ui:
  service:
    type: ClusterIP          # exposed via the ALB Ingress, not a LoadBalancer
