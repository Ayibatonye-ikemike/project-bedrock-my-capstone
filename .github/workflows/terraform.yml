name: Terraform

# Plan on PRs (comment the plan), apply on merge to main.
# Auth uses GitHub OIDC -> an AWS IAM role (no long-lived keys in the repo).
#
# Required repository variables/secrets:
#   vars.AWS_ROLE_ARN   -> ARN of the IAM role trusting this repo via OIDC
#   (region is hardcoded to us-east-1 below)

on:
  pull_request:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]

permissions:
  id-token: write      # for OIDC
  contents: read
  pull-requests: write # to comment the plan

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: terraform

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      # ---- PR: plan + comment ------------------------------------------------
      - name: Terraform plan
        if: github.event_name == 'pull_request'
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan
        continue-on-error: true

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            let plan = '';
            try {
              plan = execSync('terraform show -no-color tfplan', {
                cwd: '${{ env.TF_WORKING_DIR }}'
              }).toString();
            } catch (e) {
              plan = 'Plan generation failed. Check the workflow logs.';
            }
            const body = [
              '#### Terraform Plan 📖',
              '```terraform',
              plan.length > 60000 ? plan.substring(0, 60000) + '\n... truncated ...' : plan,
              '```'
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Fail if plan errored
        if: github.event_name == 'pull_request' && steps.plan.outcome == 'failure'
        run: exit 1

      # ---- main: apply -------------------------------------------------------
      - name: Terraform apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve
